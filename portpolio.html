<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login form</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin-left: 50px;
            padding-left: 200px;
            box-sizing: border-box;
        }

        body {
            background-image: url(rashmi.jpg);
            background-size: cover;
            background-repeat: no-repeat;
        }

        #my form {
            width: 250px;
            border: 2px;
            background-color: #fffbfb22;
            border-radius: 10px;
            margin: 50px auto;
        }

        #heading {
            color: white;
            margin: 10;
            text-shadow: 2px 2px 2px black;
            text-align: center;
        }
    </style>
</head>

<body>
    <form id="my_form">
        <h1 id="heading">
            LOGIN
        </h1>
        <br><br>
        <input type="text" id="username" placeholder="NAME">
        <br>
        <input type="password" id="pass" placeholder="password">
        <br>
        <div id="info">
            <div>
                <input type="checkbox" id="remember">remember me
            </div>
            <div>
                <a href="#" id="forget">forget</a>
            </div><br>
            <div>
                <input type="submit" value="login" id="login_bu">
            </div>
        </div>
    </form>

</body>

</html>
